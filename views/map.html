<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Geolocation Intelligence — Live Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/magenta.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- intel bar ---------- */
        .mg-mapbar {
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            gap: var(--mg-s3);
            padding: var(--mg-s3) clamp(var(--mg-s3), 3vw, var(--mg-s4));
            background: var(--mg-bg-deep);
            border-bottom: 1px solid var(--mg-border);
        }

        .mg-idpanel {
            display: flex;
            align-items: center;
            gap: var(--mg-s3);
            margin: 0;
            padding: var(--mg-s2) var(--mg-s4);
            font-weight: 400;
        }

        .mg-idpanel h4 {
            margin: 0;
            font: inherit;
        }

        .mg-meta {
            display: flex;
            align-items: center;
            gap: var(--mg-s3);
            flex: 1;
            min-width: 200px;
            padding: var(--mg-s2) var(--mg-s4);
        }

        .mg-meta__text {
            font-family: var(--mg-font-mono);
            font-size: .68rem;
            line-height: 1.5;
            color: var(--mg-text-dim);
        }

        /* ---------- follow-location control ---------- */
        .mg-follow {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            margin: 0;
            padding: var(--mg-s2) var(--mg-s4);
            font-family: var(--mg-font-body);
            font-size: .74rem;
            font-weight: 600;
            letter-spacing: .02em;
            color: var(--mg-text-dim);
            background: var(--mg-panel-solid);
            border: 1px solid var(--mg-border);
            border-radius: var(--mg-r);
            cursor: pointer;
            white-space: nowrap;
            transition: color var(--mg-t-fast) var(--mg-ease), border-color var(--mg-t-fast) var(--mg-ease);
        }

        .mg-follow__dot {
            width: .5rem;
            height: .5rem;
            flex: none;
            border-radius: 50%;
            background: var(--mg-text-dim);
        }

        .mg-follow[aria-pressed="true"] {
            color: var(--mg-pink);
            border-color: rgba(255, 47, 159, .5);
        }

        .mg-follow[aria-pressed="true"] .mg-follow__dot {
            background: var(--mg-pink);
            box-shadow: 0 0 10px rgba(255, 47, 159, .9);
        }

        .mg-follow:focus-visible {
            outline: 2px solid var(--mg-pink);
            outline-offset: 2px;
        }

        /* ---------- map ---------- */
        #map {
            flex: 1;
            height: 100%;
            width: 100%;
            background: var(--mg-bg);
            animation: mgIn var(--mg-t-slow) var(--mg-ease) both;
        }

        /* Basemap tiles are deliberately left untouched: the satellite layer
           already carries its own natural colours, and an invert filter would
           destroy it. Markers live in a different pane and stay unaffected. */

        /* ---------- basemap switch (Leaflet layers control) ---------- */
        .leaflet-control-layers {
            background: rgba(11, 7, 19, .9);
            border: 1px solid var(--mg-border);
            border-radius: var(--mg-r);
            box-shadow: var(--mg-shadow);
            color: var(--mg-text);
            backdrop-filter: blur(6px);
        }

        .leaflet-control-layers-toggle {
            width: 34px;
            height: 34px;
            background-color: rgba(11, 7, 19, .9);
            background-image: none;
            border: 1px solid var(--mg-border);
            border-radius: var(--mg-r);
            position: relative;
        }

        /* three stacked bars instead of the default missing-image glyph */
        .leaflet-control-layers-toggle::before,
        .leaflet-control-layers-toggle::after {
            content: "";
            position: absolute;
            left: 9px;
            right: 9px;
            height: 2px;
            background: var(--mg-pink);
            box-shadow: 0 5px 0 var(--mg-pink), 0 10px 0 var(--mg-pink);
        }

        .leaflet-control-layers-toggle::before {
            top: 7px;
        }

        .leaflet-control-layers-toggle::after {
            display: none;
        }

        .leaflet-control-layers-list {
            padding: .55rem .7rem;
            font-size: .74rem;
            font-weight: 600;
        }

        .leaflet-control-layers label {
            display: flex;
            align-items: center;
            gap: .45rem;
            padding: .12rem 0;
            cursor: pointer;
        }

        .leaflet-control-layers input {
            accent-color: var(--mg-pink);
        }

        /* ---------- satellite availability notice ---------- */
        .mg-mapnotice {
            position: absolute;
            z-index: 800;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: .7rem;
            max-width: min(92vw, 460px);
            padding: .55rem .8rem;
            font-size: .74rem;
            line-height: 1.4;
            color: var(--mg-text);
            background: rgba(11, 7, 19, .94);
            border: 1px solid var(--mg-border);
            border-radius: var(--mg-r);
            box-shadow: var(--mg-shadow);
            /* never swallow map gestures */
            pointer-events: none;
        }

        .mg-mapnotice.is-visible {
            display: flex;
        }

        .mg-mapnotice button {
            flex: none;
            pointer-events: auto;
            padding: .3rem .7rem;
            font: inherit;
            font-weight: 700;
            color: #14000A;
            background: var(--mg-pink);
            border: 0;
            border-radius: 2px;
            cursor: pointer;
        }

        /* ---------- tracked-location marker ---------- */
        .mg-pin {
            position: relative;
            /* the Leaflet divIcon container is sized inline; this span must be a
               block box or width/height are ignored and the pin collapses */
            display: block;
            width: 30px;
            height: 30px;
        }

        /* white halo keeps the dot readable over bright roads as well as
           dark vegetation */
        .mg-pin__core {
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: var(--mg-pink);
            border: 2px solid #14000A;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .92), 0 2px 10px rgba(0, 0, 0, .75);
        }

        .mg-pin__ring {
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            border: 2px solid var(--mg-pink);
            opacity: .55;
            animation: mgPinPulse 2.4s var(--mg-ease) infinite;
        }

        @keyframes mgPinPulse {
            0% {
                transform: scale(.55);
                opacity: .7;
            }

            70% {
                transform: scale(1.25);
                opacity: 0;
            }

            100% {
                transform: scale(1.25);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .mg-pin__ring {
                animation: none;
            }
        }

        /* ---------- control chrome ---------- */
        .leaflet-control-zoom a {
            background: var(--mg-panel-solid);
            color: var(--mg-pink);
            border: 1px solid var(--mg-border);
            border-bottom: 1px solid var(--mg-border-soft);
            transition: background-color var(--mg-t-fast) var(--mg-ease), color var(--mg-t-fast) var(--mg-ease);
        }

        .leaflet-control-zoom a:hover {
            background: rgba(255, 22, 139, .18);
            color: var(--mg-pink);
        }

        .leaflet-control-attribution {
            background: rgba(11, 7, 19, .9) !important;
            color: var(--mg-text-dim) !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: var(--mg-pink) !important;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: var(--mg-panel-solid);
            color: var(--mg-text);
            border: 1px solid var(--mg-border);
            border-radius: var(--mg-r);
            box-shadow: var(--mg-shadow);
        }

        .leaflet-container {
            font-family: var(--mg-font-body);
        }

        @media (max-width: 620px) {
            .mg-meta {
                display: none;
            }
        }
    </style>
</head>

<body class="mg-body">
    <div class="mg-bg"></div>
    <div class="mg-grid"></div>

    <!-- ================= INTEL BAR ================= -->
    <div class="mg-mapbar">
        <h4 class="mg-panel mg-panel--hud mg-idpanel mg-in">
            <span class="mg-label mg-label--pink">Location ID</span>
            <span class="mg-dot" aria-hidden="true"></span>
            <span id="display-id" class="mg-id"></span>
        </h4>

        <div class="mg-panel mg-panel--hud mg-meta mg-in" style="--mg-d:120ms">
            <span class="mg-label mg-label--pink">Tracking Feed</span>
            <span class="mg-meta__text">
                Marker position updates automatically on each incoming coordinate report from this target.
            </span>
        </div>

        <!-- centres the map on incoming coordinates only; never touches tracking -->
        <button id="follow-toggle" class="mg-follow mg-in" style="--mg-d:200ms" type="button" aria-pressed="true">
            <span class="mg-follow__dot" aria-hidden="true"></span>
            <span id="follow-label">Following</span>
        </button>
    </div>

    <!-- map container preserved: #map, initialization, tile layer, marker -->
    <div id="map">
        <div id="map-notice" class="mg-mapnotice" role="status" aria-live="polite">
            <span id="map-notice-text">Satellite imagery is unavailable right now.</span>
            <button id="map-notice-action" type="button">Street Map</button>
        </div>
    </div>

    <!-- basemap settings, rendered server-side from config.js.
         Read through dataset because the template engine escapes
         interpolated values, so they must never sit inside a <script>. -->
    <div id="map-config" hidden
        data-satellite-url="{{ mapCfg.satellite.url }}"
        data-satellite-labels-url="{{ mapCfg.satellite.labelsUrl }}"
        data-satellite-labels="{{ mapCfg.satellite.labels }}"
        data-satellite-attribution="{{ mapCfg.satellite.attribution }}"
        data-satellite-max-zoom="{{ mapCfg.satellite.maxZoom }}"
        data-street-url="{{ mapCfg.street.url }}"
        data-street-attribution="{{ mapCfg.street.attribution }}"
        data-street-max-zoom="{{ mapCfg.street.maxZoom }}"></div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/magenta-ui.js"></script>
    <script>
        const displayId = document.querySelector("#display-id")
        const id = new URLSearchParams(location.search).get("id")
        const latLng = JSON.parse(`{{ data }}`)
        const map = L.map('map', { maxZoom: 19 }).setView(latLng, 12)

        /* ---------- basemap provider (server-side config) ---------- */
        const cfg = document.querySelector("#map-config").dataset
        const SAT = {
            url: cfg.satelliteUrl,
            labelsUrl: cfg.satelliteLabelsUrl,
            /* the template engine renders boolean false as an empty attribute,
               so only an explicit "true" may switch the labels layer on */
            labels: cfg.satelliteLabels === "true",
            attribution: cfg.satelliteAttribution,
            maxZoom: Number(cfg.satelliteMaxZoom) || 19
        }
        const STREET = {
            url: cfg.streetUrl,
            attribution: cfg.streetAttribution,
            maxZoom: Number(cfg.streetMaxZoom) || 19
        }

        const satelliteTiles = L.tileLayer(SAT.url, {
            maxZoom: SAT.maxZoom,
            maxNativeZoom: SAT.maxZoom,
            attribution: SAT.attribution
        })

        /* place/border labels over the imagery, like a satellite view should have */
        const satelliteLabels = SAT.labels
            ? L.tileLayer(SAT.labelsUrl, {
                maxZoom: SAT.maxZoom,
                maxNativeZoom: SAT.maxZoom,
                pane: "overlayPane",
                opacity: .92
            })
            : null

        const satelliteBase = satelliteLabels
            ? L.layerGroup([satelliteTiles, satelliteLabels])
            : satelliteTiles

        const streetBase = L.tileLayer(STREET.url, {
            maxZoom: STREET.maxZoom,
            attribution: STREET.attribution
        })

        /* satellite is the default view; the control lives top-right */
        satelliteBase.addTo(map)
        L.control.layers({ "Satellite": satelliteBase, "Street Map": streetBase }, null, {
            position: "topright",
            collapsed: true
        }).addTo(map)

        /* ---------- tracked location (single marker, created once) ---------- */
        /* popup shows only data this application already holds: the target id
           from the URL and the coordinates received over the socket */
        function popupHtml(targetId, coords) {
            return '<strong>Tracked location</strong><br>' +
                (targetId ? 'ID: ' + targetId + '<br>' : '') +
                'LAT ' + coords[0] + '<br>LNG ' + coords[1]
        }

        const marker = L.marker(latLng, {
            icon: L.divIcon({
                className: "",
                html: '<span class="mg-pin"><span class="mg-pin__ring"></span><span class="mg-pin__core"></span></span>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            }),
            title: "Tracked location",
            alt: "Tracked location"
        }).addTo(map)
        marker.bindPopup(popupHtml(id, latLng))

        /* ---------- graceful tile failure ---------- */
        const notice = document.querySelector("#map-notice")
        const noticeText = document.querySelector("#map-notice-text")
        let tileFailures = 0

        satelliteTiles.on("tileerror", () => {
            tileFailures++
            if (tileFailures < 5) return
            noticeText.textContent = "Satellite imagery could not be loaded from the imagery provider."
            notice.classList.add("is-visible")
        })

        document.querySelector("#map-notice-action").addEventListener("click", () => {
            notice.classList.remove("is-visible")
            if (!map.hasLayer(streetBase)) {
                streetBase.addTo(map)
                satelliteBase.remove()
            }
        })

        /* ---------- follow-location toggle ---------- */
        const followBtn = document.querySelector("#follow-toggle")
        const followLabel = document.querySelector("#follow-label")
        let follow = true

        function setFollow(on) {
            follow = on
            followBtn.setAttribute("aria-pressed", String(on))
            followLabel.textContent = on ? "Following" : "Follow"
        }

        followBtn.addEventListener("click", () => setFollow(!follow))

        /* manual panning opts out of auto-following; tracking keeps running */
        map.on("dragstart", () => setFollow(false))

        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        })

        displayId.innerHTML = id
        // on update
        socket.on("map-data", data => {
            if (data.id == id) {
                displayId.innerHTML = `${id} - updating`
                displayId.classList.add("is-updating")

                marker.setLatLng([data.lat, data.lng])
                marker.setPopupContent(popupHtml(id, [data.lat, data.lng]))
                if (follow) map.setView([data.lat, data.lng])

                setTimeout(() => {
                    displayId.innerHTML = id
                    displayId.classList.remove("is-updating")
                }, 2500)
            }
        })
    </script>
</body>

</html>
