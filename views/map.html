<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map</title>
    <link rel="stylesheet" href="/glass.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-0);
            color: var(--txt);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        h4 {
            margin: .75rem;
            padding: .65rem 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            align-self: flex-start;
            font-size: .88rem;
            font-weight: 600;
            letter-spacing: .04em;
            color: var(--txt-dim);
            text-transform: uppercase;
            border-radius: 999px;
            animation: revealUp .7s var(--ease) both;
        }

        #display-id {
            color: var(--txt);
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            letter-spacing: .06em;
            transition: color .3s var(--ease), text-shadow .3s var(--ease);
        }

        #display-id.flash {
            color: var(--accent-3);
            text-shadow: 0 0 16px rgba(52, 211, 153, .65);
        }

        #map {
            flex: 1;
            height: 100%;
            width: 100%;
            animation: revealUp .9s .1s var(--ease) both;
        }

        /* glass leaflet chrome */
        .leaflet-control-zoom a {
            background: rgba(255, 255, 255, .12);
            color: var(--txt);
            backdrop-filter: blur(var(--blur)) saturate(150%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
            border-color: var(--glass-brd);
            transition: background-color .3s var(--ease);
        }

        .leaflet-control-zoom a:hover {
            background: rgba(255, 255, 255, .22);
        }

        .leaflet-control-attribution {
            background: rgba(5, 6, 15, .6) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--txt-dim) !important;
        }

        .leaflet-control-attribution a {
            color: var(--accent) !important;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: rgba(18, 22, 44, .88);
            color: var(--txt);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-brd);
        }
    </style>
</head>

<body>
    <h4 class="glass"><span class="g-dot" aria-hidden="true"></span> ID: <span
            id="display-id"></span></h4>
    <div id="map"></div>


    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/glass.js"></script>
    <script>
        const displayId = document.querySelector("#display-id")
        const id = new URLSearchParams(location.search).get("id")
        const latLng = JSON.parse(`{{ data }}`)
        const map = L.map('map').setView(latLng, 12)
        const marker = L.marker(latLng).addTo(map)

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map)

        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        })

        displayId.innerHTML = id
        // on update
        socket.on("map-data", data => {
            if (data.id == id) {
                displayId.innerHTML = `${id} - updating`
                displayId.classList.add("flash")

                marker.setLatLng([data.lat, data.lng])
                map.setView([data.lat, data.lng])

                setTimeout(() => {
                    displayId.innerHTML = id
                    displayId.classList.remove("flash")
                }, 2500)
            }
        })
    </script>
</body>

</html>
