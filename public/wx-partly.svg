        <circle cx="304" cy="192" r="104" />
        <rect id="wx-ray" x="298" y="14" width="12" height="48" rx="6" />
        <use href="#wx-ray" transform="rotate(45 304 192)" />
        <use href="#wx-ray" transform="rotate(90 304 192)" />
        <use href="#wx-ray" transform="rotate(135 304 192)" />
        <use href="#wx-ray" transform="rotate(180 304 192)" />
        <use href="#wx-ray" transform="rotate(225 304 192)" />
        <use href="#wx-ray" transform="rotate(270 304 192)" />
        <use href="#wx-ray" transform="rotate(315 304 192)" />
